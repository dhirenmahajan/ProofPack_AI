name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-evals:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: proofpack
          POSTGRES_PASSWORD: proofpack
          POSTGRES_DB: proofpack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U proofpack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Zero-key stub providers; sync ingestion so no Celery worker is needed.
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: proofpack
      POSTGRES_PASSWORD: proofpack
      POSTGRES_DB: proofpack
      REDIS_URL: redis://localhost:6379/0
      INGEST_MODE: sync
      STORAGE_LOCAL_DIR: ./storage
      EMBEDDING_DIM: "768"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Tesseract)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install Python deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start backend
        working-directory: backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done

      - name: Smoke test
        working-directory: backend
        run: python scripts/smoke_test.py http://localhost:8000

      - name: Eval gate (Recall@5 + faithfulness)
        working-directory: backend
        run: python -m evals.run_evals --base-url http://localhost:8000

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results.md

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install + typecheck + build
        working-directory: frontend
        run: |
          npm ci || npm install
          npx tsc --noEmit
          npm run build
